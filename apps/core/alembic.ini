# Alembic config for developers using the `alembic` CLI directly, e.g.:
#   uv run alembic revision --autogenerate -m "add something"
# The database URL comes from ULTRON settings (.env), never from this file.
[alembic]
script_location = ultron_core:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
