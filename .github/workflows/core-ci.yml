name: ULTRON Core CI

on:
  push:
    paths:
      - "apps/core/**"
      - "docker-compose.yml"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "apps/core/**"
      - "docker-compose.yml"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/core

    # Throwaway CI-only services; no real ULTRON data or credentials.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ultron
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ultron
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ultron -d ultron"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      ULTRON_TEST_DATABASE_URL: postgresql://ultron:ci-only-password@localhost:5432/ultron_test
      ULTRON_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build ULTRON Core image
        run: docker build -t ultron-core:ci apps/core
